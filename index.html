<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Neon Gravity Runner — неон-аркада з перемиканням гравітації та кампанією з 15 рівнів.">
    <meta name="theme-color" content="#05010f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="format-detection" content="telephone=no">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Neon Gravity Runner">
    <meta property="og:title" content="Neon Gravity Runner">
    <meta property="og:description" content="Неон-аркада з перемиканням гравітації: 15 рівнів кампанії, зірки, бонуси та Neon Storm. Грається прямо в браузері.">
    <title>Neon Gravity Runner</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚀</text></svg>">
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas" aria-label="Ігрове поле"></canvas>

        <!-- HUD під час гри -->
        <div id="hud" class="hidden">
            <div class="hud-left">
                <div class="hud-score"><span id="hud-score">0</span></div>
                <div class="hud-combo hidden" id="hud-combo">
                    <span id="hud-combo-value">x0</span>
                </div>
            </div>

            <div class="hud-center">
                <div id="hud-level-info" class="hidden">
                    <div id="hud-level-title" class="hud-level-title">Рівень 1</div>
                    <div id="hud-level-progress-bar" class="hud-progress-bar">
                        <div id="hud-level-progress-fill" class="hud-progress-fill"></div>
                    </div>
                </div>
            </div>

            <div class="hud-right">
                <div class="hud-badges" id="hud-badges"></div>
                <button id="hud-pause" class="icon-btn" aria-label="Пауза">⏸</button>
            </div>
        </div>

        <!-- Оверлеї-екрани -->
        <div id="screen-main" class="screen"></div>
        <div id="screen-levels" class="screen hidden"></div>
        <div id="screen-victory" class="screen hidden"></div>
        <div id="screen-leaderboard" class="screen hidden"></div>
        <div id="screen-skins" class="screen hidden"></div>
        <div id="screen-achievements" class="screen hidden"></div>
        <div id="screen-settings" class="screen hidden"></div>
        <div id="screen-stats" class="screen hidden"></div>
        <div id="screen-pause" class="screen hidden"></div>
        <div id="screen-gameover" class="screen hidden"></div>
        <div id="screen-tutorial" class="screen hidden"></div>

        <!-- Завантажувальний екран -->
        <div id="screen-boot" class="screen">
            <div class="boot-box">
                <div class="boot-title">NEON GRAVITY RUNNER</div>
                <div class="boot-loader">
                    <div class="boot-bar"><div class="boot-fill" id="boot-fill"></div></div>
                    <div class="boot-text" id="boot-text" data-i18n="boot.init">Ініціалізація…</div>
                </div>
            </div>
        </div>

        <!-- Екран критичної помилки -->
        <div id="screen-error" class="screen hidden">
            <div class="error-box">
                <div class="error-icon">⚠</div>
                <h2 data-i18n="error.title">Щось пішло не так</h2>
                <p id="error-text" data-i18n="error.text">Сталася неочікувана помилка.</p>
                <pre id="error-stack"></pre>
                <button id="error-reload" class="btn primary" data-i18n="error.reload">Перезапустити гру</button>
            </div>
        </div>

        <!-- Тости сповіщень -->
        <div id="toast-container" class="toast-container"></div>
    </div>

    <!-- ===================================================== -->
    <!-- ПОРЯДОК СКРИПТІВ КРИТИЧНИЙ!                          -->
    <!-- core (без boot/main) → fx → skins, achievements →    -->
    <!-- gameplay (player…scoring, levels) → ui (ui…hud) →     -->
    <!-- gameplay/game → ui/input → core/boot → core/main    -->
    <!-- ===================================================== -->
    <script src="core/logger.js"></script>
    <script src="core/safe_storage.js"></script>
    <script src="core/state.js"></script>
    <script src="core/config.js"></script>
    <script src="core/utils.js"></script>
    <script src="core/collision.js"></script>
    <script src="core/i18n.js"></script>

    <!-- ===================================================== -->
    <!-- ХМАРНА СИНХРОНІЗАЦІЯ ПРОГРЕСУ (Supabase)              -->
    <!-- 1. Створіть безкоштовний проєкт на https://supabase.com -->
    <!-- 2. Виконайте SQL з README.md (розділ «Хмарна синхронізація») -->
    <!-- 3. Вставте URL та anon-ключ нижче — рядок «Хмарна     -->
    <!--    синхронізація» з'явиться в налаштуваннях гри.      -->
    <!-- Якщо поля порожні, гра працює суто локально.          -->
    <!-- ===================================================== -->
    <script>
        window.NGR_CLOUD_CONFIG = {
            supabaseUrl: '',
            supabaseKey: ''
        };
    </script>
    <script src="core/cloud_storage.js"></script>

    <script src="fx/audio.js"></script>
    <script src="fx/particles.js"></script>
    <script src="fx/floating_text.js"></script>
    <script src="fx/background.js"></script>
    <script src="fx/effects.js"></script>

    <script src="ui/skins.js"></script>
    <script src="ui/achievements.js"></script>

    <script src="gameplay/player.js"></script>
    <script src="gameplay/obstacle.js"></script>
    <script src="gameplay/obstacles.js"></script>
    <script src="gameplay/bonus.js"></script>
    <script src="gameplay/bonuses.js"></script>
    <script src="gameplay/storm.js"></script>
    <script src="gameplay/scoring.js"></script>
    <script src="gameplay/levels.js"></script>
    <script src="gameplay/modes.js"></script>

    <script src="ui/ui.js"></script>
    <script src="ui/screens.js"></script>
    <script src="ui/hud.js"></script>
    <script src="gameplay/game.js"></script>
    <script src="ui/input.js"></script>

    <script src="core/boot.js"></script>
    <script src="core/main.js"></script>
</body>
</html>
